<div class="w-full max-w-full">
    <p-galleria [value]="images()" [showThumbnails]="false" [showIndicators]="true" [transitionInterval]="5000"
        [autoPlay]="true" [containerStyle]="{ 'max-width': '100%'}">
        <ng-template #item let-item>
            <img (click)="onImageClick(item)" [src]="item.url" [alt]="item.alt || 'Slide image'"
                class="w-full h-[600px] object-cover block cursor-pointer" />
        </ng-template>
    </p-galleria>
</div>
