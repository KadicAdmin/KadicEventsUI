@let currentUsers = currentUser; @if (isAuthenticated) {
<div class="min-h-screen bg-gray-50 flex flex-col">
  <p-menubar [model]="menuItems" class="border-b">
    <ng-template pTemplate="end">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-600">Welcome, {{ currentUsers?.firstName }}</span>
        <p-button icon="pi pi-sign-out" [text]="true" severity="secondary" (onClick)="logout()" pTooltip="Logout" />
      </div>
    </ng-template>
  </p-menubar>
  <main class="container mx-auto flex-1">
    <router-outlet />
  </main>
  <app-footer></app-footer>
</div>
} @else {
<div class="min-h-screen flex flex-col">
  <main class="flex-1">
    <router-outlet />
  </main>
  <app-footer></app-footer>
</div>
}
